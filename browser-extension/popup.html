<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; font-family: -apple-system, system-ui, sans-serif;
           background: #1a1818; color: #f0eef0; padding: 14px; }
    .logo { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    .logo .p { color: #f0eef0; }
    .logo .d { color: #db52a6; }
    label { font-size: 12px; color: #999; display: block; margin: 8px 0 4px; }
    select { width: 100%; padding: 6px 8px; background: #242222; color: #f0eef0;
             border: 1px solid #2e2c2c; border-radius: 7px; font-size: 13px; }
    button { width: 100%; margin-top: 12px; padding: 9px; border: none; border-radius: 8px;
             background: #db52a6; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:hover { background: #c9479a; }
    .status { font-size: 12px; margin-top: 10px; min-height: 16px; color: #999; }
    .link { font-size: 11px; color: #888; margin-top: 10px; text-align: center; }
    .link a { color: #db52a6; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>
  <div class="logo"><span class="p">digital</span><span class="d">+downloads</span></div>
  <label for="fmt">Download as</label>
  <select id="fmt">
    <option value="video">Video (MP4)</option>
    <option value="audio">Audio (MP3)</option>
  </select>
  <button id="go">Download this page</button>
  <div class="status" id="status"></div>
  <div class="link"><a id="opts">Pairing &amp; settings</a></div>
  <script src="popup.js"></script>
</body>
</html>
